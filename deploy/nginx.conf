# nginx with PHP-FPM: serve /opt/labeler/public as the document root.
server {
    listen 80;
    server_name _;
    root /opt/labeler/public;
    index index.html;
    client_max_body_size 4m;

    location = /api.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/api.php;
        fastcgi_pass unix:/run/php/php-fpm.sock;   # adjust to your PHP version's socket
        fastcgi_read_timeout 90s;
    }
    location ~ \.php$ { return 404; }
}
