name: Upstream ptouch-print

# Weekly contract test against the newest upstream ptouch-print, to notice command line or
# output changes (like the one behind #1) before users do.
on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t labeler-contract --build-arg PTOUCH_REF=master tools/contract
      - run: docker run --rm -v "$PWD:/work" labeler-contract
