name: Release

# On a tag vX.Y.Z: build labeler-X.Y.Z.zip and labeler-agent-X.Y.Z.zip, publish a GitHub
# release with them, and push the image ghcr.io/<owner>/labeler:X.Y.Z, :X.Y and :latest.
# On main: push the image as :main.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  consistency:
    name: Docs and code consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the screenshot check compares commit dates
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION_ARG: ${{ startsWith(github.ref, 'refs/tags/v') && format('--version {0}', github.ref_name) || '' }}
        run: python3 tools/consistency_check.py --config tools/consistency.json $VERSION_ARG

  image:
    name: Container image
    needs: consistency
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          # latest only for a release (the raw rule below), never for a push to main
          flavor: latest=false
          # Labeler is MIT; the image also contains ptouch-print (GPL-3.0, see /usr/share/doc/ptouch-print)
          labels: |
            org.opencontainers.image.licenses=MIT AND GPL-3.0-only
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # ptouch-print is a few C files, compiling it under QEMU takes a few minutes
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: true
          sbom: true
          build-args: VERSION=${{ github.ref_type == 'tag' && github.ref_name || 'main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [consistency, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the package
        run: |
          sh tools/package.sh "${GITHUB_REF_NAME#v}"
          (cd build && sha256sum labeler-*.zip > SHA256SUMS)
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          generate_release_notes: true
          files: |
            build/labeler-*.zip
            build/SHA256SUMS
          body: |
            Install or update on the device: see [docs/INSTALL.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/INSTALL.md).
            Printer agent only: `labeler-agent-*.zip` (`install.sh --agent` downloads it).
            Container image: `ghcr.io/${{ github.repository }}:${{ github.ref_name }}` ([docs/DOCKER.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/DOCKER.md)).
