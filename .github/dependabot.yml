version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    ignore:
      # PHPUnit 10+ drops PHP 7.4, which Raspberry Pi OS bullseye still ships
      - dependency-name: phpunit/phpunit
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
  - package-ecosystem: docker
    directories: [/tools/dev, /tools/contract]
    schedule:
      interval: weekly
    labels: [dependencies]
